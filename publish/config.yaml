# Account-level configuration (no secrets). Per-article values override this in
# articles/<slug>/article.yaml.
# Secrets live only in .env (LLM_API_KEY / WECHAT_APPID / WECHAT_APPSECRET).

# ── Positioning ──
account_name: Paper to Post
article_category: LLM research explainers
# Audience definition is fed to the model, so it is kept in the target language.
target_reader: 算法工程师、AI Infra / 推理优化工程师、研究者；看得懂 Transformer 与训练细节，但没有时间读全文论文
tone: 克制、判断明确、不吹
# WeChat truncates the author field at 8 UTF-8 bytes; keep it short.
default_author: Paper
update_frequency: 2-3 articles per week

# ── Structure ──
# Section headings must match article.md exactly (checked by publish-check A2),
# so they are kept in the language the articles are written in.
required_sections:
  - TL;DR
  - 引言            # Introduction
  - 问题            # Problem
  - 方法            # Method
  - 实验设置        # Experimental setup
  - 主要结果        # Results
  - 深入分析        # Analysis
  - 讨论与判断      # Discussion and takeaways
target_word_count: "3500-6000"
max_chars_per_bold: 160       # force a bold run at least every N characters

# ── Figures ──
image_density: 每节一图       # one figure per section; long-form slides paginate, body stays text
cover_style: 深色科技 + 大数字

# ── Review ──
review_required:
  - 数字一致性      # numeric consistency
  - 公式可渲染      # formulas render
  - 敏感词          # prohibited terms
  - 错别字          # typos
  - Markdown 硬规则 # markdown hard rules

# ── Publishing intent ──
# none = do not publish; draft = create a draft / stop at the editor; published = publish directly
platforms:
  zhihu:
    mode: draft
    formula_style: native      # native = Zhihu formula block; fallback = plain text
  xiaohongshu:
    mode: draft                # six slides plus short copy
  wechat:
    mode: draft                # requires WECHAT_APPID / WECHAT_APPSECRET
